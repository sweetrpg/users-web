---
apiVersion: v1
kind: ConfigMap

metadata:
  name: web-env

data:
  ENV: local
  PORT: "8080"
  # Traefik strips /users before the request reaches this app, same as the dev overlay - every
  # link/redirect this app generates needs the prefix added back.
  INGRESS_BASE_PATH: /users
  # Shared host behind the single traefik-tailscale front door, same convention as the dev
  # overlay's dev.sweetrpg.com.
  ROOT_URL: https://sweetrpg.local/
  ASSETS_URL: https://sweetrpg.local/assets
  SHARED_URL: https://sweetrpg.local/shared
  BUILD_INFO_PATH: /app/config/build-info.json
  LOG_LEVEL: info
  # Server-to-server backend URL, called directly Service-to-Service - no ingress in the path.
  USERS_API_URL: http://api-v1.sweetrpg-users.svc.cluster.local:8000
  # Same Redis instance as the dev overlay - a shared session store, not environment-specific
  # infra. Password comes from secrets.yaml's ExternalSecret.
  SHARED_SESSION_REDIS_HOST: cache.sweetrpg-auth.svc.cluster.local
  SHARED_SESSION_REDIS_PORT: "6379"
  SHARED_SESSION_REDIS_DB: "0"
