---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: users-web-shared-session

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: web-shared-session
        creationPolicy: Owner
    dataFrom:
        # Same Akeyless path as the dev overlay - a shared secret, not environment-specific
        # infra. See kubernetes/overlays/dev/secrets.yaml.
        - extract:
              key: /sweetrpg/auth/cache/auth
          rewrite:
              - regexp:
                    source: "REDIS_PASS"
                    target: "SHARED_SESSION_REDIS_PASS"
