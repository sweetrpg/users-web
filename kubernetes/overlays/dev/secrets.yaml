---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: users-web-shared-session

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: web-shared-session
        creationPolicy: Owner
    dataFrom:
        # auth-web's own Redis instance requires auth - same Akeyless path catalog-web's own
        # shared-session ExternalSecret reads (sweetrpg-auth namespace). Renamed from REDIS_PASS
        # to SHARED_SESSION_REDIS_PASS on the way in - configure.swift reads it under that name.
        - extract:
              key: /sweetrpg/auth/cache/auth
          rewrite:
              - regexp:
                    source: "REDIS_PASS"
                    target: "SHARED_SESSION_REDIS_PASS"
