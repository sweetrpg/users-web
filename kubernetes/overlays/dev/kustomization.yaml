apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sweetrpg-users

resources:
  - ../../base
  - configmaps.yaml
  - ingress.yaml
  - middlewares.yaml
  - pod-monitor.yaml
  - secrets.yaml

labels:
  - pairs:
      app.kubernetes.io/name: users-web
      app.kubernetes.io/version: v1
      app.kubernetes.io/component: web
      app.kubernetes.io/part-of: users
      com.sweetrpg/env: dev
    includeSelectors: false
    includeTemplates: true

generatorOptions:
  disableNameSuffixHash: true

images:
  - name: users-web
    newName: ghcr.io/sweetrpg/users-web
    newTag: latest
