name: CI

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  ci:
    uses: sweetrpg/github-actions/.github/workflows/swift-ci.yaml@master
    with:
      # Unconstrained dependency resolution pulls in swift-log/swift-nio releases requiring
      # a newer swift-tools-version than this reusable workflow's "6.0" default toolchain -
      # see admin-web's ci.yaml for the same note.
      swift-version: "6.2"
    secrets: inherit
